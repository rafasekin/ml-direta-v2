<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo Expirado - ML Direta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .expired-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .expired-icon {
            font-size: 4rem;
            color: #ff6b6b;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('user_dashboard') }}">
                <i class="fas fa-graduation-cap"></i> ML Direta
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('logout') }}">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </a>
            </div>
        </div>
    </nav>

    <div class="expired-card">
        <i class="fas fa-clock expired-icon"></i>
        
        <h2 class="mb-4">Tempo de Exibição Expirado</h2>
        
        <div class="alert alert-warning">
            <i class="fas fa-exclamation-triangle"></i>
            <p class="mb-0">
                Por gentileza, entre em contato com a gestão de pessoas.
            </p>
        </div>
        
        <div class="user-info mt-4">
            <h5>{{ user.nome_completo }}</h5>
            <p class="text-muted">Matrícula: {{ user.matricula }}</p>
            <p class="text-muted">
                Tempo de exibição expirou em: {{ user.tempo_exibicao | format_date }}
            </p>
        </div>
        
        <div class="mt-4">
            <button type="button" class="btn btn-primary" onclick="window.print()">
                <i class="fas fa-print"></i> Imprimir
            </button>
            <a href="{{ url_for('logout') }}" class="btn btn-secondary ms-2">
                <i class="fas fa-sign-out-alt"></i> Sair
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

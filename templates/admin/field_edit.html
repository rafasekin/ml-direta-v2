{% extends "base.html" %}

{% block title %}Editar Campo{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>
                    <i class="fas fa-edit"></i> Editar Campo
                </h2>
                <a href="{{ url_for('admin_categories') }}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-folder"></i> Categoria
                            </label>
                            <input type="text" class="form-control" value="{{ category_name }}" readonly>
                        </div>
                        
                        <div class="mb-3">
                            <label for="field_name" class="form-label">
                                <i class="fas fa-tag"></i> Nome do Campo
                            </label>
                            <input type="text" class="form-control" id="field_name" 
                                   name="field_name" value="{{ field_name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="field_type" class="form-label">
                                <i class="fas fa-cog"></i> Tipo do Campo
                            </label>
                            <select class="form-control" id="field_type" name="field_type" required>
                                <option value="text" {% if field.type == 'text' %}selected{% endif %}>Texto</option>
                                <option value="date" {% if field.type == 'date' %}selected{% endif %}>Data</option>
                                <option value="link" {% if field.type == 'link' %}selected{% endif %}>Link</option>
                                <option value="select" {% if field.type == 'select' %}selected{% endif %}>Seleção</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="required" 
                                       name="required" {% if field.required %}checked{% endif %}>
                                <label class="form-check-label" for="required">
                                    <i class="fas fa-asterisk"></i> Campo Obrigatório
                                </label>
                            </div>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> 
                            <strong>Atenção:</strong> Ao renomear o campo, os dados existentes 
                            dos usuários serão mantidos com o novo nome.
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Salvar Alterações
                            </button>
                            
                            <form method="POST" action="{{ url_for('admin_field_delete', category_name=category_name, field_name=field_name) }}" 
                                  onsubmit="return confirm('Tem certeza que deseja deletar este campo?')">
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-trash"></i> Deletar Campo
                                </button>
                            </form>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

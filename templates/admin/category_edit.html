{% extends "base.html" %}

{% block title %}Editar Categoria{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>
                    <i class="fas fa-edit"></i> Editar Categoria
                </h2>
                <a href="{{ url_for('admin_categories') }}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="category_name" class="form-label">
                                <i class="fas fa-folder"></i> Nome da Categoria
                            </label>
                            <input type="text" class="form-control" id="category_name" 
                                   name="category_name" value="{{ category_name }}" required>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> 
                            <strong>Atenção:</strong> Ao renomear a categoria, todos os campos 
                            associados também serão movidos para o novo nome.
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Salvar Alterações
                            </button>
                            
                            <form method="POST" action="{{ url_for('admin_category_delete', category_name=category_name) }}" 
                                  onsubmit="return confirm('Tem certeza que deseja deletar esta categoria e todos os seus campos?')">
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-trash"></i> Deletar Categoria
                                </button>
                            </form>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
